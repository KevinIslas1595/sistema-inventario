<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | Sistema de Inventario</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <div class="pantalla-login">
    <div class="caja-login">

      <h1>Sistema de Inventario</h1>
      <p class="subtitulo">Punto de venta y control de almacen</p>

      <div id="aviso" class="aviso error oculto"></div>

      <form id="formLogin">
        <div class="campo">
          <label for="correo">Correo</label>
          <input type="email" id="correo" placeholder="admin@demo.com" required autocomplete="username">
        </div>

        <div class="campo">
          <label for="clave">Contrasena</label>
          <input type="password" id="clave" placeholder="••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="boton">Entrar</button>
      </form>

      <div class="ayuda-demo">
        <strong>Usuarios de prueba</strong><br>
        Administrador: <code>admin@demo.com</code> / <code>demo123</code><br>
        Empleado: <code>empleado@demo.com</code> / <code>demo123</code>
      </div>

    </div>
  </div>

  <script src="js/datos.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
